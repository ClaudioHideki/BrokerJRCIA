name: Service Desk intake isolated validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_DB: lab_broker_ci
          POSTGRES_USER: lab_broker_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: --health-cmd "pg_isready -U lab_broker_admin -d lab_broker_ci" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
        ports: ['127.0.0.1:6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: 'true'
      TEST_DATABASE_ADMIN_URL: postgresql://lab_broker_admin@127.0.0.1:5432/lab_broker_ci
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Typed contracts, editor and proof regression
        run: >-
          npm test -- --maxWorkers=1
          apps/api/tests/unit/automation-conversation-protocol.test.ts
          apps/api/tests/unit/automation-domain-command.test.ts
          apps/api/tests/unit/automation-service-desk-intake.test.ts
          apps/api/tests/unit/automation-intake-renderer.test.ts
          apps/api/tests/unit/chatwoot-domain-command-client.test.ts
          apps/web/src/automations/node-editors/ConversationActionEditor.test.tsx
      - name: Real PostgreSQL outbox and acknowledgement recovery
        run: npm run test:integration -- apps/api/tests/integration/automation-domain-central.test.ts --maxWorkers=1
