name: Delivery PostgreSQL regressions

on:
  push:
    branches: [codex/whatsapp-delivery-reliability-20261116]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_DB: lab_broker_delivery_ci
          POSTGRES_USER: lab_broker_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lab_broker_admin -d lab_broker_delivery_ci"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://lab_broker_admin@127.0.0.1:5432/lab_broker_delivery_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - name: Compile workspace modules used by physical storage fixtures
        run: npx tsc -b --pretty false
      - name: Exercise generic compatibility and physical media confirmation
        run: >-
          npm test -- --config vitest.integration.config.ts --maxWorkers=1
          apps/api/tests/integration/chatwoot-media-matrix.test.ts
          apps/api/tests/integration/history-import-chatwoot.test.ts
          apps/api/tests/integration/partner-media-store.test.ts
          apps/api/tests/integration/qr-chatwoot-storage.test.ts
          apps/api/tests/integration/qr-outbound-observation.test.ts
          apps/api/tests/integration/history-sync-catalogue-lifecycle.test.ts
          apps/api/tests/integration/durable-private-media.test.ts
          apps/api/tests/integration/history-sync-schema.test.ts
      - name: Verify private object bytes and revoked access against real MinIO
        run: npm run test:storage:ci
      - run: git diff --exit-code && git diff --check
