name: jrc-broker

x-runtime: &a1
  NODE_ENV: production
  DATABASE_URL: postgresql://jrc_app:${JRC_APP_PASSWORD:?required}@postgres:5432/jrc_broker
  AUTH_DATABASE_URL: postgresql://jrc_auth:${JRC_AUTH_PASSWORD:?required}@postgres:5432/jrc_broker
  REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379/0
  EVOLUTION_BASE_URL: http://evolution:8080
  EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?required}
  JWT_SECRET: ${JWT_SECRET:?required}
  REFRESH_TOKEN_HASH_SECRET: ${REFRESH_TOKEN_HASH_SECRET:?required}
  API_KEY_HMAC_SECRET: ${API_KEY_HMAC_SECRET:?required}
  IP_RATE_LIMIT_HMAC_SECRET: ${IP_RATE_LIMIT_HMAC_SECRET:?required}
  IDENTITY_RATE_LIMIT_HMAC_SECRET: ${IDENTITY_RATE_LIMIT_HMAC_SECRET:?required}
  CHALLENGE_ENCRYPTION_KEY: ${CHALLENGE_ENCRYPTION_KEY:?required}
  BROWSER_CSRF_SECRET: ${BROWSER_CSRF_SECRET:?required}
  CONSOLE_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?required}
  CONSOLE_COOKIE_SECURE: "true"
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?required}
  CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:?required}
  INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?required}
  CHATWOOT_PLATFORM_TOKEN: ${CHATWOOT_PLATFORM_TOKEN:-}
  CHATWOOT_MEDIA_ORIGINS: ${CHATWOOT_MEDIA_ORIGINS:-}
  MEDIA_STORAGE_BYTES_PER_ORGANIZATION: ${MEDIA_STORAGE_BYTES_PER_ORGANIZATION:-1073741824}
  QR_WEBHOOK_ORIGIN: http://api:3000
  QR_WEBHOOK_SIGNING_KEY: ${QR_WEBHOOK_SIGNING_KEY:?required}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  META_SIGNUP_CONFIG_ID: ${META_SIGNUP_CONFIG_ID:-}
  META_GRAPH_VERSION: ${META_GRAPH_VERSION:-}
  META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY:-}
  META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
  META_CREDENTIALS_JSON: ${META_CREDENTIALS_JSON:?required-json-object}
  META_ASSET_BINDINGS_JSON: ${META_ASSET_BINDINGS_JSON:?required-json-object}
  TYPEBOT_ORIGINS_JSON: ${TYPEBOT_ORIGINS_JSON:?required-json-object}

services:

  web:
    image: ${JRC_WEB_IMAGE:?required}
    restart: unless-stopped
    environment:
      API_ORIGIN: http://api:3000
    expose:
      - "8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
      - backend
      - dokploy-network
      - default
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.jrc-broker-broker-ophydn-57-web.rule=Host(`jrc-broker.jrcws.cloud`)
      - traefik.http.routers.jrc-broker-broker-ophydn-57-web.entrypoints=web
      - traefik.http.services.jrc-broker-broker-ophydn-57-web.loadbalancer.server.port=8080
      - traefik.http.routers.jrc-broker-broker-ophydn-57-web.service=jrc-broker-broker-ophydn-57-web
      - traefik.http.routers.jrc-broker-broker-ophydn-57-web.middlewares=redirect-to-https@file
      - traefik.http.routers.jrc-broker-broker-ophydn-57-websecure.rule=Host(`jrc-broker.jrcws.cloud`)
      - traefik.http.routers.jrc-broker-broker-ophydn-57-websecure.entrypoints=websecure
      - traefik.http.services.jrc-broker-broker-ophydn-57-websecure.loadbalancer.server.port=8080
      - traefik.http.routers.jrc-broker-broker-ophydn-57-websecure.service=jrc-broker-broker-ophydn-57-websecure
      - traefik.http.routers.jrc-broker-broker-ophydn-57-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true

  api:
    image: ${JRC_API_IMAGE:?required}
    restart: unless-stopped
    environment:
      <<: *a1
      PLATFORM_DATABASE_URL: postgresql://jrc_platform:${JRC_PLATFORM_PASSWORD:?required}@postgres:5432/jrc_broker
      PLATFORM_MFA_KEY: ${PLATFORM_MFA_KEY:?required}
      PLATFORM_ORIGIN: ${PUBLIC_ORIGIN:?required}
      PLATFORM_LOGIN_MODE: ${PLATFORM_LOGIN_MODE:-password}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - egress
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1

  api-debug:
    image: ${JRC_API_IMAGE:?required}
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        echo "=== JRC API DEBUG V4 ==="
        echo "PWD:"
        pwd

        echo "=== PREPARANDO SERVER DEBUG ==="

        cp apps/api/dist/server.js apps/api/dist/server-debug.js

        echo "=== ALTERANDO CATCH PARA EXIBIR ERRO REAL ==="

        node - <<'NODE'
        const fs = require('node:fs');

        const file = 'apps/api/dist/server-debug.js';
        let source = fs.readFileSync(file, 'utf8');

        const oldCode = `catch {
            process.stderr.write('JRC API failed to start\\n');
            process.exitCode = 1;
        }`;

        const newCode = `catch (error) {
            console.error('=== ERRO REAL DA API ===');
            console.error(error);
            console.error('NAME:', error?.name);
            console.error('MESSAGE:', error?.message);
            console.error('STACK:', error?.stack);
            process.exitCode = 1;
        }`;

        if (!source.includes(oldCode)) {
          console.error('ERRO: bloco catch esperado nao encontrado');
          process.exit(2);
        }

        source = source.replace(oldCode, newCode);
        fs.writeFileSync(file, source);

        console.log('PATCH APLICADO COM SUCESSO');
        NODE

        PATCH_CODE=$?

        if [ "$PATCH_CODE" -ne 0 ]; then
          echo "=== PATCH FALHOU ==="
          exit "$PATCH_CODE"
        fi

        echo "=== INICIANDO API DEBUG V4 ==="

        node --trace-uncaught --trace-warnings apps/api/dist/server-debug.js

        CODE=$?

        echo "=== EXIT CODE: $CODE ==="

        exit "$CODE"
    environment:
      <<: *a1
      PLATFORM_DATABASE_URL: postgresql://jrc_platform:${JRC_PLATFORM_PASSWORD:?required}@postgres:5432/jrc_broker
      PLATFORM_MFA_KEY: ${PLATFORM_MFA_KEY:?required}
      PLATFORM_ORIGIN: ${PUBLIC_ORIGIN:?required}
      PLATFORM_LOGIN_MODE: ${PLATFORM_LOGIN_MODE:-password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - egress

  worker:
    image: ${JRC_API_IMAGE:?required}
    entrypoint:
      - node
      - apps/api/dist/commands/messaging-worker.js
      - --watch
    restart: unless-stopped
    environment:
      <<: *a1
      MESSAGING_WORKER_MODE: automatic
      MESSAGING_WORKER_SHARDS: ${MESSAGING_WORKER_SHARDS:-1}
      MESSAGING_WORKER_SHARD: ${MESSAGING_WORKER_SHARD:-0}
      WORKER_HEARTBEAT_FILE: /tmp/jrc-worker-heartbeat
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backend
      - egress
    read_only: true
    tmpfs:
      - /tmp:size=1m,uid=1000,gid=1000,mode=0700
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const fs=require('node:fs');try{const t=Number(fs.readFileSync('/tmp/jrc-worker-heartbeat','utf8'));process.exit(Date.now()-t<180000?0:1)}catch{process.exit(1)}
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1

  migrate:
    image: ${JRC_API_IMAGE:?required}
    restart: "no"
    entrypoint:
      - node
      - infra/app/provision.mjs
    environment:
      MIGRATION_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?required}@postgres:5432/jrc_broker
      JRC_APP_PASSWORD: ${JRC_APP_PASSWORD:?required}
      JRC_AUTH_PASSWORD: ${JRC_AUTH_PASSWORD:?required}
      JRC_PLATFORM_PASSWORD: ${JRC_PLATFORM_PASSWORD:?required}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jrc_broker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d jrc_broker
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    mem_limit: 2g
    cpus: 2

  redis:
    image: redis:7.4.0-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - yes
      - --requirepass
      - ${REDIS_PASSWORD:?required}
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test:
        - CMD
        - redis-cli
        - -a
        - ${REDIS_PASSWORD:?required}
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data
    networks:
      - backend
    mem_limit: 512m
    cpus: 0.5

  evolution:
    image: ${EVOLUTION_ENGINE_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://jrc_evolution:${EVOLUTION_DB_PASSWORD:?required}@postgres:5432/jrc_evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: jrc_broker
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:?required}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY: jrc-evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?required}
    volumes:
      - engine_instances:/evolution/instances
    networks:
      - backend
      - egress
    mem_limit: 2g
    cpus: 2

networks:
  edge: null

  backend:
    internal: true

  egress: null

  dokploy-network:
    external: true

volumes:
  postgres_data: null
  redis_data: null
  engine_instances: null
