services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - baseline_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4.0-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - baseline_redis:/data

  evolution:
    image: jrc-evolution-engine:${EVOLUTION_ENGINE_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: jrc_broker
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/6
      CACHE_REDIS_PREFIX_KEY: jrc-evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - baseline_instances:/evolution/instances

volumes:
  baseline_postgres:
  baseline_redis:
  baseline_instances:
